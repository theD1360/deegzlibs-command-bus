# Publishes to PyPI when a version tag is pushed (e.g. v1.2.3 from Commitizen bump workflow).
# Also supports manual re-runs via workflow_dispatch.
#
# Repository secret (Settings → Secrets → Actions):
#   PYPI_API_TOKEN — PyPI API token; use username __token__ style (paste full pypi-... token).

name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish (e.g. v2.1.0). Leave empty to publish HEAD."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Require PYPI_API_TOKEN
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Missing repository secret PYPI_API_TOKEN. Add it under Settings → Secrets → Actions."
            exit 1
          fi

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/* --non-interactive
